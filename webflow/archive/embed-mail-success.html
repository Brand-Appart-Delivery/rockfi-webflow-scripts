<!--
  Archive : icône animée "email envoyé" (enveloppe + pastille + check).
  Utilisée sur le modèle de page Ressources (message de succès du formulaire)
  quand la ressource était envoyée par email. Remplacée le 27/10/2026 par
  embed-download-success.html (téléchargement direct). À recoller tel quel
  dans l'embed du bloc .w-form-done si l'envoi par email revient.
-->
<style>
  .mail-success {
    display: block;
    margin: 0 auto;
    overflow: visible;
    animation: ms-bounce .5s ease-out 1.2s;
  }
  .mail-success path {
    transform-box: fill-box;
    transform-origin: center;
  }

  /* Cadre : se dessine */
  .mail-success .ms-frame {
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
    animation: ms-draw .6s cubic-bezier(.65,0,.35,1) forwards;
  }

  /* Rabat : se dessine juste après */
  .mail-success .ms-flap {
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
    animation: ms-draw .45s cubic-bezier(.65,0,.35,1) .35s forwards;
  }

  /* Pastille jaune : pop avec rebond */
  .mail-success .ms-badge {
    opacity: 0;
    transform: scale(0);
    animation: ms-pop .5s cubic-bezier(.34,1.56,.64,1) .7s forwards;
  }

  /* Check : se trace */
  .mail-success .ms-check {
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
    animation: ms-draw .35s ease-out 1.05s forwards;
  }

  @keyframes ms-draw {
    to { stroke-dashoffset: 0; }
  }
  @keyframes ms-pop {
    to { opacity: 1; transform: scale(1); }
  }
  @keyframes ms-bounce {
    0%, 100% { transform: translateY(0); }
    40%      { transform: translateY(-6px); }
    70%      { transform: translateY(0); }
  }

  /* Accessibilité : réduit les animations si demandé par l'OS */
  @media (prefers-reduced-motion: reduce) {
    .mail-success,
    .mail-success * {
      animation-duration: .01s !important;
      animation-delay: 0s !important;
    }
  }
</style>

<svg class="mail-success" width="72" height="72" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Cadre de l'enveloppe -->
  <path class="ms-frame" pathLength="1"
    d="M51.3 18H11.7C10.2088 18 9 19.2088 9 20.7V47.7C9 49.1912 10.2088 50.4 11.7 50.4H51.3C52.7912 50.4 54 49.1912 54 47.7V20.7C54 19.2088 52.7912 18 51.3 18Z"
    stroke="#1A1A1A" stroke-width="1.26" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Rabat -->
  <path class="ms-flap" pathLength="1"
    d="M9 21.6016L31.5 37.8016L54 21.6016"
    stroke="#1A1A1A" stroke-width="1.26" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Pastille jaune -->
  <path class="ms-badge"
    d="M52.1992 63.8984C59.6551 63.8984 65.6992 57.8543 65.6992 50.3984C65.6992 42.9426 59.6551 36.8984 52.1992 36.8984C44.7434 36.8984 38.6992 42.9426 38.6992 50.3984C38.6992 57.8543 44.7434 63.8984 52.1992 63.8984Z"
    fill="#E5F33E" stroke="white" stroke-width="2.7"/>

  <!-- Check -->
  <path class="ms-check" pathLength="1"
    d="M45.8984 50.3984L50.3984 54.8984L58.4984 45.8984"
    stroke="#1A1A1A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
