<script>
  (function () {
    var ORIGIN = 'https://www.rockfi.fr';
    var isEn = window.ROCKFI_IS_EN;
    var path = location.pathname.replace(/\/+$/, '');
    var pageUrl = ORIGIN + (path || '/');

    function addMeta(key, value) {
      var m = document.createElement('meta');
      m.setAttribute('property', key);
      m.setAttribute('content', value);
      document.head.appendChild(m);
    }

    addMeta('og:url', pageUrl);
    addMeta('og:locale', isEn ? 'en_GB' : 'fr_FR');
    addMeta('og:locale:alternate', isEn ? 'fr_FR' : 'en_GB');
    addMeta('og:site_name', 'RockFi');
  })();
</script>

<!-- Provenance des leads RockFi (doit rester AVANT le formulaire Fillout) -->
<script>
  (function () {
    // Provenance des leads : calcule le canal de chaque visite, garde le dernier canal non direct
    // (et le premier canal), 90 jours, sur tout rockfi.fr. Sur les pages à formulaire Fillout,
    // ajoute ces valeurs à l'URL sous des noms préfixés rf_ : Fillout les reprend dans ses champs cachés
    // (data-fillout-inherit-parameters) sans que GA4 ni Google Ads ne relisent d'anciens UTM ou gclid.
    if (window.__rfProvenance) return; // déjà exécuté (head Webflow puis GTM)
    window.__rfProvenance = true;
    var FORM_PAGES = /^\/(en\/)?(contact-conseiller|devenir-partner|contact-team)\/?$/;
    var isForm = location.hostname === 'lp.rockfi.fr' || FORM_PAGES.test(location.pathname);
    var KEYS = ['utm_source', 'utm_medium', 'utm_campaign', 'utm_term', 'utm_content', 'gclid', 'fbclid'];
    var NAME = 'rf_provenance',
      DOMAIN = '.rockfi.fr',
      MAX_AGE = 60 * 60 * 24 * 90;

    function q(n) {
      var m = new RegExp('[?&]' + n + '=([^&#]*)').exec(location.search);
      if (!m) return '';
      try {
        return decodeURIComponent(m[1].replace(/\+/g, ' '));
      } catch (e) {
        return m[1];
      }
    }
    function host(u) {
      try {
        return new URL(u).hostname.replace(/^www\./, '');
      } catch (e) {
        return '';
      }
    }

    function canal() {
      var src = q('utm_source').toLowerCase(),
        med = q('utm_medium').toLowerCase();
      var paid = /(^|[^a-z])(cpc|ppc|paid|ads?|display|sea)([^a-z]|$)/.test(med);
      if (q('gclid') || q('gbraid') || q('wbraid')) return 'Google Ads';
      if ((/linkedin/.test(src) && paid) || q('li_fat_id')) return 'LinkedIn Ads';
      if (/facebook|instagram|meta|^fb$|^ig$/.test(src) && paid) return 'Meta Ads';
      if (/google|bing/.test(src) && paid) return 'Google Ads';
      if (/e-?mail|newsletter/.test(med)) return 'Email';
      if (src) return src + (med ? ' / ' + med : '');
      if (q('fbclid')) return 'Réseaux sociaux';
      var r = host(document.referrer);
      if (!r || /(^|\.)rockfi\.fr$/.test(r)) return ''; // direct ou navigation interne
      if (/chatgpt|openai|perplexity|gemini\.google|copilot|claude\.ai|mistral/.test(r)) return 'Assistants IA';
      if (/^mail\.|outlook\.|^webmail/.test(r)) return 'Email';
      if (/(^|\.)(google\.|bing\.|qwant\.|duckduckgo\.|ecosia\.|yahoo\.|search\.brave)/.test(r)) return 'SEO';
      if (/linkedin|facebook|instagram|youtube|^t\.co$|^x\.com$|twitter/.test(r)) return 'Réseaux sociaux';
      return 'Site référent : ' + r;
    }

    function read() {
      try {
        var m = document.cookie.match(new RegExp('(?:^|;\\s*)' + NAME + '=([^;]+)'));
        return m ? JSON.parse(decodeURIComponent(m[1])) : {};
      } catch (e) {
        return {};
      }
    }
    function write(v) {
      document.cookie = NAME + '=' + encodeURIComponent(JSON.stringify(v)) + '; path=/; domain=' + DOMAIN + '; max-age=' + MAX_AGE + '; SameSite=Lax; Secure';
    }

    var p = read(),
      c = canal();
    if (c) {
      // nouvelle visite non directe : elle devient le dernier canal
      var t = { canal: c, page_entree: location.hostname + location.pathname };
      KEYS.forEach(function (k) {
        var v = q(k);
        if (v) t[k] = v;
      });
      t.canal_premier = p.canal_premier || c;
      p = t;
      try {
        write(p);
      } catch (e) {}
    } else if (!p.canal) {
      p = { canal: 'Direct', canal_premier: 'Direct', page_entree: location.hostname + location.pathname };
      try {
        write(p);
      } catch (e) {}
    }

    if (!isForm) return;
    try {
      var url = new URL(location.href),
        touched = false;
      KEYS.concat(['canal', 'canal_premier', 'page_entree']).forEach(function (k) {
        var name = 'rf_' + k;
        if (p[k] && url.searchParams.get(name) !== p[k]) {
          url.searchParams.set(name, p[k]);
          touched = true;
        }
      });
      if (touched) history.replaceState(history.state, '', url.toString());
    } catch (e) {}
  })();
</script>

<!-- CSS global
     Production : main.css depuis jsDelivr.
     Staging (.webflow.io, localhost) : main.css depuis le serveur de dev (tunnel ou localhost:3000).
     Seulement si c'est le dev de CE projet (nom du package.json) : sinon code de production. -->
<script>
  (function () {
    const PROJECT = 'rockfi'; // « name » du package.json
    const DEV_ORIGINS = ['https://dev.michelaxel.fr', 'http://localhost:3000'];
    const PROD_URL = 'https://cdn.jsdelivr.net/gh/Brand-Appart-Delivery/rockfi-webflow-scripts@main/main.css?v=v0.0.31';

    function loadCSS(url) {
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = url;
      document.head.appendChild(link);
    }

    function initLiveReload(origin) {
      try {
        const es = new EventSource(origin + '/esbuild');
        es.addEventListener('change', () => location.reload());
      } catch (e) {}
    }

    async function findDevOrigin() {
      for (const origin of DEV_ORIGINS) {
        try {
          // Le serveur de dev doit être celui de CE projet (le tunnel sert
          // aussi les autres clients) : on compare le nom de son package.json
          const r = await fetch(origin + '/package.json', { cache: 'no-store' });
          const pkg = r.ok ? await r.json() : null;
          if (pkg && pkg.name === PROJECT) return origin;
          console.warn('[RockFi] Serveur de dev ignoré (' + origin + ') : projet ' + (pkg && pkg.name));
        } catch (e) {}
      }
      return null;
    }

    async function load() {
      const host = window.location.hostname;
      const isDevOrStaging = host === 'localhost' || host === '127.0.0.1' || host.endsWith('.webflow.io');
      if (!isDevOrStaging) return loadCSS(PROD_URL);

      const origin = await findDevOrigin();
      if (origin) {
        loadCSS(origin + '/main.css');
        initLiveReload(origin);
        return;
      }
      loadCSS(PROD_URL);
    }
    load();
  })();
</script>
